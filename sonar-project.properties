sonar.projectKey=xzawed_ArcanaInsight
sonar.organization=xzawed

sonar.projectName=ArcanaInsight
sonar.projectVersion=1.0

# 분석 대상 소스
sonar.sources=src
sonar.tests=src,e2e
sonar.exclusions=**/.next/**,**/node_modules/**,**/public/**,**/*.d.ts,**/generated/**
sonar.test.inclusions=src/**/*.test.ts,src/**/*.spec.ts,e2e/**/*.spec.ts

# 커버리지 리포트 (Vitest v8 lcov)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# 커버리지 분모에서 제외 — vitest coverage.include와 정확히 동기화
# lcov.info에 포함된 파일 (vitest coverage.include):
#   topics.ts, env.ts, supabase-adapter.ts, rate-limit.ts, useSSEStream.ts, services/**
# 아래 목록은 lcov.info에 없는 파일만 제외 → SonarCloud 커버리지 뱃지가 Vitest 95%+와 일치
sonar.coverage.exclusions=\
  **/*.test.ts,**/*.spec.ts,\
  src/test-helpers/**,\
  src/types/**,\
  src/app/**,\
  src/components/**,\
  src/hooks/useCardAnimation.ts,\
  src/hooks/useCharacter.ts,\
  src/hooks/useFavoriteCharacter.ts,\
  src/hooks/useGenderStore.ts,\
  src/hooks/useSajuSession.ts,\
  src/hooks/useSession.ts,\
  src/hooks/useShinjeomSession.ts,\
  src/hooks/useSkinStore.ts,\
  src/hooks/useCardStyleStore.ts,\
  src/hooks/useTheme.ts,\
  src/data/characters/**,\
  src/data/shinjeom/**,\
  src/data/skins/**,\
  src/data/cards/**,\
  src/data/cardStyles.ts,\
  src/data/home/**,\
  src/data/spreads/**,\
  src/data/saju/constants.ts,\
  src/data/saju/categories.ts,\
  src/data/birth-hours.ts,\
  src/data/error-messages.ts,\
  src/data/topics-meta.ts,\
  src/lib/supabase/client.ts,\
  src/lib/supabase/server.ts,\
  src/lib/supabase/middleware.ts,\
  src/lib/supabase/storage.ts,\
  src/lib/auth/**,\
  src/lib/storage/**,\
  src/lib/db/schema/**,\
  src/lib/db/types.ts,\
  src/lib/db/postgres-adapter.ts,\
  src/lib/db/supabase-admin-adapter.ts,\
  src/lib/db/reading-saver.ts,\
  src/services/core/ai-provider.ts,\
  src/services/saju/saju-types.ts,\
  src/i18n/LocaleProvider.tsx,\
  src/i18n/useT.ts,\
  src/i18n/server-locale.ts,\
  src/i18n/translations/ko/**,\
  src/i18n/translations/en/**,\
  src/i18n/translations/ja/**

sonar.sourceEncoding=UTF-8
sonar.qualitygate.wait=false
sonar.typescript.tsconfigPath=tsconfig.json

# 중복도(CPD) 분모에서 제외
# - 정적 데이터 파일: 동일 키셋이 반복되므로 본질적으로 중복
# - API 라우트: SSE 스트리밍 스캐폴딩(ReadableStream·controller·encoder) 구조가 라우트마다 동일하나 Next.js 패턴에 의한 것
# - i18n 번역 파일: ko/en/ja가 동일 키 구조를 공유하므로 구조적 중복 (의도된 패턴)
# - 레이아웃 컴포넌트: 데스크탑/모바일 분리 패턴이 구조상 반복되나 접근성·testid 요건으로 통합 불가
# - 서비스 페이지: Next.js App Router page.tsx에서 Suspense·서비스 소개 블록이 서비스마다 동일 구조
# - session 페이지: SSE 스트리밍 핸들러가 서비스마다 동일 Next.js 패턴
sonar.cpd.exclusions=\
  src/app/api/**,\
  src/app/*/page.tsx,\
  src/app/*/session/page.tsx,\
  src/components/layout/**,\
  src/data/characters/**,\
  src/data/shinjeom/**,\
  src/data/cards/**,\
  src/data/skins/**,\
  src/data/spreads/**,\
  src/data/home/**,\
  src/data/saju/constants.ts,\
  src/data/saju/categories.ts,\
  src/data/birth-hours.ts,\
  src/data/error-messages.ts,\
  src/data/topics-meta.ts,\
  src/lib/db/schema/**,\
  src/types/**,\
  src/i18n/translations/**

# TypeScript 분석 강화
sonar.javascript.environments=browser,node
