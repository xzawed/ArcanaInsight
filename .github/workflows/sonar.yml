name: SonarCloud & Codecov — 코드 품질 분석

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'n8n/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'n8n/**'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pull-requests: write   # SonarCloud PR 코멘트·데코레이션
  statuses: write        # 커밋 상태 업데이트

jobs:
  sonar:
    name: SonarCloud 정적 분석
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # SonarCloud는 전체 git 히스토리 필요 (blame, 새 코드 감지)

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      # ── 단위/통합 테스트 + 커버리지 (Vitest) ──────────────────────────────
      # type-check·lint·E2E는 deploy.yml에서 이미 검증 — 여기서는 coverage 생성만
      - name: 단위·통합 테스트 실행 (커버리지 포함)
        run: pnpm test:coverage

      # ── SonarCloud 분석 ──────────────────────────────────────────────────
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6.0.0
        with:
          args: >
            -Dsonar.qualitygate.wait=false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # ── Codecov 업로드 (unit flag — Vitest lcov) ─────────────────────────
      - name: Codecov 업로드 (unit)
        uses: codecov/codecov-action@v4
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          flags: unit
          name: arcana-unit
          fail_ci_if_error: false
          verbose: false

      # ── 아티팩트 보존 ────────────────────────────────────────────────────
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sonar-coverage-report
          path: |
            coverage/lcov.info
            coverage/coverage-summary.json
            coverage/junit.xml
          retention-days: 14
