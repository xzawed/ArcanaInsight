name: QA Recheck — 수정 후 자동 재검증

# QA 실패 Issue가 열려있는 상태에서 main에 push되면 자동으로 주간 QA 재실행
on:
  push:
    branches: [main]
    # 문서만 변경된 경우 재검증 스킵
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'n8n/**'
      - '.github/ISSUE_TEMPLATE/**'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  issues: read     # QA 실패 Issue 목록 조회
  actions: write   # weekly-qa.yml dispatch 트리거

jobs:
  check-and-recheck:
    name: QA Issue 확인 + 재검증
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        id: check
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'qa',
              state: 'open',
            });
            const hasIssues = issues.some(i => i.title.startsWith('🚨 주간 QA 실패'));
            if (!hasIssues) {
              console.log('열린 QA 실패 Issue 없음 → 재검증 스킵');
              return;
            }
            console.log('🔄 QA 실패 Issue 감지 → 주간 QA 자동 재실행');
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'weekly-qa.yml',
              ref: 'main',
            });
