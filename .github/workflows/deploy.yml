name: CI — Lint, Type Check, Build & E2E

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'n8n/**'
      - '.github/ISSUE_TEMPLATE/**'

# 배포는 Railway 자체 GitHub 연동이 담당 (railway.toml 기준 자동 배포)
# 이 워크플로우는 코드 품질 검증 전용

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  # ── 1단계: 정적 검사 (즉시 시작) ──────────────────────────────────────────
  static:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "10.33.0"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm type-check

  # ── 2단계: 단위·통합 테스트 (static와 병렬 시작) ────────────────────────
  unit:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "10.33.0"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-coverage
          path: coverage/
          retention-days: 7

  # ── 3단계: 프로덕션 빌드 (static 통과 후 시작, .next/cache GHA 캐시 재사용) ──
  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "10.33.0"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Next.js 증분 빌드 캐시 — 의존성 미변경 PR에서 warm build로 30-70% 단축
      - name: Next.js 빌드 캐시 복원
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx', 'src/**/*.css') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}-
            nextjs-${{ runner.os }}-

      - run: pnpm build
        env:
          # 자산 CDN(R2). NEXT_PUBLIC_ 접두사라 **빌드 타임에 인라인**되므로 E2E 잡이 아니라
          # 여기서 반드시 설정해야 클라이언트 번들에 반영된다. 미설정 시 storageBase()가
          # NEXT_PUBLIC_SUPABASE_URL(=placeholder.supabase.co)로 폴백하는데, Supabase
          # card-styles 버킷은 2026-07-03 삭제(0객체)라 카드 이미지가 전량 404가 된다.
          NEXT_PUBLIC_ASSET_BASE_URL: https://cdn.xzawed.xyz
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          GROK_API_KEY: ${{ secrets.GROK_API_KEY || 'placeholder-grok-key' }}
          GROK_MODEL: grok-3
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'placeholder-service-key' }}

      # .next/cache/** 제외 — E2E가 런타임 서빙에 불필요한 캐시 디렉터리 전송 방지
      - uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: |
            .next/
            !.next/cache/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # ── 4단계: E2E (build 완료 즉시 시작, unit과 독립 병렬 실행) ─────────────
  # playwright.config.ts webServer.command: process.env.CI ? "pnpm start" : "pnpm dev"
  # unit 테스트는 E2E 정확성과 무관 — E2E는 build 산출물만 있으면 시작 가능
  e2e:
    name: E2E — ${{ matrix.project }} (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    needs: [build]
    strategy:
      fail-fast: false
      # 프로젝트 × 2샤드. 샤딩은 잡당 spec 수를 절반으로 낮춰 피크 메모리를 줄이고
      # (호스트 OOM 크래시 완화 — workers:1은 빈도만 낮췄을 뿐 근본 해소가 아님),
      # workers:1로 늘어난 벽시계 시간도 병렬로 회수한다.
      matrix:
        project: ["Desktop Chrome", "Mobile Android"]
        shard: [1, 2]
        # include의 키가 기존 조합과 일치하면 해당 조합들에 slug·workers를 덧붙인다
        # (아티팩트명에 공백 포함 프로젝트명을 쓰지 않기 위한 슬러그).
        # workers는 프로젝트 단위로 다르게 줄 수 있다 — #522의 단계적 상향 검증용.
        include:
          - project: "Desktop Chrome"
            slug: desktop
            workers: 1
          - project: "Mobile Android"
            slug: android
            workers: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "10.33.0"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next/

      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Playwright 설치 (캐시 미스)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Playwright 시스템 의존성 설치 (캐시 히트)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # 러너 실측 스펙 — workers 결정의 근거는 추정이 아니라 이 출력이어야 한다(#522).
      # "2코어/7GB"라는 기존 근거가 실제와 다른 것이 확인돼, 코어 수까지 매 런 기록한다.
      - name: 러너 스펙 기록
        run: |
          {
            echo "### 러너 스펙 — ${{ matrix.project }} (${{ matrix.shard }}/2)"
            echo '```'
            echo "nproc: $(nproc)"
            lscpu | grep -E "^(Model name|CPU\(s\)|Thread\(s\) per core|Core\(s\) per socket)" || true
            free -m | head -2
            echo "E2E_WORKERS: ${E2E_WORKERS:-1}"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          E2E_WORKERS: ${{ matrix.workers }}

      - name: E2E 실행 (피크 자원 샘플링 동반)
        run: |
          # 1초 간격 샘플링. 스텝 종료 후의 free -m은 브라우저·Next 서버가 이미 내려간 뒤라
          # 피크를 보여주지 못한다 — 실행 중에 찍어야 workers 상향 여유를 판정할 수 있다.
          # 메모리만으로는 부족하다: #462의 크래시 원인이 CPU 포화일 수도 있어 함께 잰다.
          # loadavg는 D-state(I/O 대기)를 포함해 CPU 포화의 직접 증거가 못 되므로,
          # /proc/stat 누적값을 같이 남겨 busy%·iowait%를 구간 델타로 계산한다.
          # 필드: used available swap load1 cpu_total cpu_idle cpu_iowait
          # 샘플당 프로세스는 awk 하나뿐이다 — CPU가 포화 직전인 호스트에서 계측이
          # 관측 대상을 흔들면 안 된다(free+cut+awk 조합은 샘플당 4프로세스였다).
          # used는 free -m과 같은 정의(total-available)라 앞선 측정과 비교 가능하다.
          while :; do
            awk 'FILENAME == "/proc/meminfo" {
                   if ($1 == "MemTotal:") mt = $2 / 1024
                   if ($1 == "MemAvailable:") ma = $2 / 1024
                   if ($1 == "SwapTotal:") st = $2 / 1024
                   if ($1 == "SwapFree:") sf = $2 / 1024
                 }
                 FILENAME == "/proc/loadavg" { load = $1 }
                 FILENAME == "/proc/stat" && $1 == "cpu" {
                   t = 0; for (i = 2; i <= NF; i++) t += $i
                   idle = $5; io = $6
                 }
                 END { printf "%d %d %d %s %d %d %d\n", mt - ma, ma, st - sf, load, t, idle, io }' \
              /proc/meminfo /proc/loadavg /proc/stat
            sleep 1
          done > /tmp/e2e-mem.log &
          sampler=$!
          set +e
          pnpm test:e2e --project="${{ matrix.project }}" --shard=${{ matrix.shard }}/2
          status=$?
          set -e
          kill "$sampler" 2>/dev/null || true
          exit $status
        env:
          CI: "true"
          # 매트릭스가 지정하지 않으면 playwright.config.ts가 1로 폴백한다.
          E2E_WORKERS: ${{ matrix.workers }}
          # 서버 런타임(pnpm start)의 서버 컴포넌트 경로용 — 클라이언트 인라인은 build 잡이 담당.
          # 두 잡의 값이 갈리면 SSR/CSR 이미지 URL이 어긋나므로 항상 동일하게 유지한다.
          NEXT_PUBLIC_ASSET_BASE_URL: https://cdn.xzawed.xyz
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          GROK_API_KEY: ${{ secrets.GROK_API_KEY || 'placeholder-grok-key' }}
          GROK_MODEL: grok-3
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'placeholder-service-key' }}

      # OOM 관측 — 지금까지 "Target closed" 크래시는 시그니처 기반 추정이었고 직접 관측된 적이 없다.
      # 재발 시 추정이 아니라 증거로 판단하기 위해 피크 사용량과 커널 OOM-killer 로그를 남긴다.
      - name: 피크 자원·OOM 요약
        if: always()
        run: |
          export NPROC="$(nproc)"
          {
            echo "### 자원 사용 — ${{ matrix.project }} (${{ matrix.shard }}/2), workers=${{ matrix.workers }}"
            echo '```'
            if [ -s /tmp/e2e-mem.log ]; then
              awk '{ if ($1 > pu) pu = $1
                     if (ma == "" || $2 < ma) ma = $2
                     if ($3 > ps) ps = $3
                     if ($4 > pl) pl = $4
                     sl += $4
                     # /proc/stat은 누적값 — 인접 샘플 델타로 구간 사용률을 구한다.
                     if (NR > 1) {
                       dt = $5 - t; di = $6 - i; dw = $7 - w
                       if (dt > 0) {
                         busy = (dt - di - dw) / dt * 100
                         io = dw / dt * 100
                         sb += busy; si += io; n++
                         if (busy > pb) pb = busy
                       }
                     }
                     t = $5; i = $6; w = $7 }
                   END { printf "샘플 수       : %d (1s 간격)\n", NR
                         printf "피크 used     : %d MiB\n", pu
                         printf "최저 available: %d MiB\n", ma
                         printf "피크 swap     : %d MiB\n", ps
                         printf "피크 loadavg  : %.2f (nproc=%s)\n", pl, ENVIRON["NPROC"]
                         printf "평균 loadavg  : %.2f\n", NR ? sl / NR : 0
                         printf "평균 CPU busy : %.1f%% (iowait 제외)\n", n ? sb / n : 0
                         printf "피크 CPU busy : %.1f%% (1s 창)\n", pb
                         printf "평균 iowait   : %.1f%%\n", n ? si / n : 0 }' /tmp/e2e-mem.log
            else
              echo "샘플 없음 (E2E 스텝이 시작 전에 실패)"
            fi
            echo "-- 스텝 종료 시점 --"
            free -m | head -2
            echo "-- OOM-killer 흔적 (dmesg) --"
            sudo dmesg 2>/dev/null | grep -iE "out of memory|oom-kill|killed process" || echo "OOM 흔적 없음"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.slug }}-shard${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7
